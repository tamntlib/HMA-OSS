name: Main

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/issue.yml'
      - '.github/workflows/pull_request.yml'
      - 'fastlane/**'
      - '**.md'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  workflow_call:
    inputs:
      ref:
        type: string
      upstream_tag:
        type: string
      upstream_sha:
        type: string

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
    if: ${{ !startsWith(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: 'recursive'
          fetch-depth: 0

      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Write key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          echo officialBuild=true >> local.properties
          echo storePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> local.properties
          echo keyAlias='${{ secrets.ALIAS }}' >> local.properties
          echo keyPassword='${{ secrets.ALIAS_KEY_PASSWORD }}' >> local.properties
          echo fileDir=`pwd`/key.jks >> local.properties
          echo crowdinProjectId='${{ secrets.CROWDIN_PROJECT_ID }}' >> local.properties
          echo crowdinApiKey='${{ secrets.CROWDIN_LIST_MEMBERS_API_TOKEN }}' >> local.properties
          echo "${{ secrets.KEY_STORE }}" | base64 --decode > key.jks

      - name: Cache gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Use upstream version
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          UPSTREAM_SHA: ${{ inputs.upstream_sha }}
        run: |
          if [ -z "$UPSTREAM_TAG" ]; then
            UPSTREAM_TAG=$(gh api repos/frknkrc44/HMA-OSS/releases/latest --jq .tag_name)
          fi
          [[ "$UPSTREAM_TAG" =~ ^oss-[0-9]+$ ]]
          git fetch --no-tags https://github.com/frknkrc44/HMA-OSS.git "+refs/tags/$UPSTREAM_TAG:refs/remotes/upstream/release"
          upstream=$(git rev-parse refs/remotes/upstream/release^{commit})
          [[ -z "$UPSTREAM_SHA" || "$upstream" == "$UPSTREAM_SHA" ]]
          git update-ref refs/remotes/origin/master "$upstream"

      - name: Set manager package
        run: |
          python3 - <<'PY'
          from pathlib import Path

          package = "io.github.tamntlib.hma_oss"
          old_package = "org.frknkrc44.hma_oss"
          changes = {
              "app/build.gradle.kts": [
                  ('    defaultConfig {\n', f'    defaultConfig {{\n        applicationId = "{package}"\n'),
              ],
              "common/build.gradle.kts": [
                  ('\\"$appPackageName\\"', f'\\"{package}\\"'),
              ],
              "app/src/main/AndroidManifest.xml": [
                  ('android:name=".MainActivityLauncher', 'android:name="${applicationId}.MainActivityLauncher'),
              ],
              "zygote/src/main/assets/action.sh": [(f'PKG={old_package}', f'PKG={package}')],
              "zygote/src/main/assets/customize.d/35-install-manager-app.sh": [(old_package, package)],
              "zygote/src/main/java/org/frknkrc44/hma_oss/zygote/util/ServiceUtils.kt": [
                  ('\n                    BuildConfig.APP_PACKAGE_NAME,', f'\n                    "{old_package}",'),
              ],
              "app/src/main/java/icu/nullptr/hidemyapplist/data/AppConstants.kt": [
                  ('https://api.github.com/repos/frknkrc44/HMA-OSS/releases/latest', 'https://api.github.com/repos/tamntlib/HMA-OSS/releases/latest'),
              ],
              "zygote/build.gradle.kts": [
                  ('    author = "frknkrc44"', '    author = "tamntlib"'),
                  ('https://furkank.net/hma_oss_update_checker.json', 'https://github.com/tamntlib/HMA-OSS/releases/latest/download/update.json'),
              ],
          }
          for filename, replacements in changes.items():
              path = Path(filename)
              source = path.read_text()
              for old, new in replacements:
                  if old not in source:
                      raise SystemExit(f"Package replacement target missing: {filename}")
                  source = source.replace(old, new)
              path.write_text(source)
          PY

      - name: Gradle prebuild
        run: |
          ./gradlew prebuild

      - name: Build APK
        run: |
          ./gradlew :app:assemble

      - name: Upload APK mappings
        uses: actions/upload-artifact@v7
        with:
          name: app-mappings
          path: "app/build/outputs/mapping/release"

      - name: Build module
        id: buildModule
        run: |
          ./gradlew :zygote:assemble
          echo "releaseName=$(ls zygote/build/outputs/magisk/release/*.zip | awk -F '(/|.zip)' '{print $6}')" >> $GITHUB_OUTPUT
          echo "debugName=$(ls zygote/build/outputs/magisk/debug/*.zip | awk -F '(/|.zip)' '{print $6}')" >> $GITHUB_OUTPUT
          echo "releaseFile=$(ls zygote/build/outputs/magisk/release/*.zip)" >> $GITHUB_OUTPUT
          echo "debugFile=$(ls zygote/build/outputs/magisk/debug/*.zip)" >> $GITHUB_OUTPUT
          echo "ossNum=$(ls app/build/outputs/apk/debug/*.apk | awk -F '(/|.apk)' '{print $6}' | cut -f4 -d'-')" >> $GITHUB_OUTPUT

      - name: Write module update feed
        env:
          RELEASE_FILE: ${{ steps.buildModule.outputs.releaseFile }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import zipfile

          archive = Path(os.environ["RELEASE_FILE"])
          with zipfile.ZipFile(archive) as module:
              props = dict(line.split("=", 1) for line in module.read("module.prop").decode().splitlines() if "=" in line)
          release = f"https://github.com/{os.environ['REPOSITORY']}/releases/download/{props['version']}"
          Path("update.json").write_text(json.dumps({
              "version": props["version"],
              "versionCode": int(props["versionCode"]),
              "zipUrl": f"{release}/{archive.name}",
              "changelog": f"{release}/changelog.md",
          }, indent=2) + "\n")
          Path("changelog.md").write_text(subprocess.check_output(["git", "log", "-1", "--format=%B"], text=True))
          PY

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: ${{ steps.buildModule.outputs.releaseName }}
          path: ${{ steps.buildModule.outputs.releaseFile }}

      - name: Upload module mappings
        uses: actions/upload-artifact@v7
        with:
          name: zygote-mappings
          path: "zygote/build/outputs/mapping/release"

      - name: Upload debug
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: ${{ steps.buildModule.outputs.debugName }}
          path: ${{ steps.buildModule.outputs.debugFile }}

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: oss-${{ steps.buildModule.outputs.ossNum }}
          body_path: changelog.md
          files: |
            ${{ steps.buildModule.outputs.releaseFile }}
            ${{ steps.buildModule.outputs.debugFile }}
            app/src/main/assets/translators.json
            update.json
            changelog.md
          tag_name: oss-${{ steps.buildModule.outputs.ossNum }}
          target_commitish: ${{ inputs.ref || github.sha }}

      - name: Post to channel
        if: ${{ github.repository == 'frknkrc44/HMA-OSS' && github.event_name != 'pull_request' && success() && github.ref == 'refs/heads/master' }}
        env:
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          export release=${{ steps.buildModule.outputs.releaseFile }}
          export debug=${{ steps.buildModule.outputs.debugFile }}
          ESCAPED=`python3 -c 'import json,os,urllib.parse; msg = json.dumps(os.environ["COMMIT_MESSAGE"]); print(urllib.parse.quote(msg if len(msg) <= 1024 else json.dumps(os.environ["COMMIT_URL"])))'`
          curl -v "https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup?chat_id=${CHANNEL_ID}&media=%5B%7B%22type%22:%22document%22,%20%22media%22:%22attach://release%22%7D,%7B%22type%22:%22document%22,%20%22media%22:%22attach://debug%22,%22caption%22:${ESCAPED}%7D%5D"  -F release="@$release" -F debug="@$debug"
