name: Main

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/issue.yml'
      - '.github/workflows/pull_request.yml'
      - 'fastlane/**'
      - '**.md'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      upstream_tag:
        type: string

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
    if: ${{ !startsWith(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Gradle wrapper validation
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Write key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          echo officialBuild=true >> local.properties
          echo storePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> local.properties
          echo keyAlias='${{ secrets.ALIAS }}' >> local.properties
          echo keyPassword='${{ secrets.ALIAS_KEY_PASSWORD }}' >> local.properties
          echo fileDir=`pwd`/key.jks >> local.properties
          echo crowdinProjectId='${{ secrets.CROWDIN_PROJECT_ID }}' >> local.properties
          echo crowdinApiKey='${{ secrets.CROWDIN_LIST_MEMBERS_API_TOKEN }}' >> local.properties
          echo "${{ secrets.KEY_STORE }}" | base64 --decode > key.jks

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Use upstream version
        id: upstreamVersion
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          UPSTREAM_REPO=$(gh api "repos/$GITHUB_REPOSITORY" --jq .parent.full_name)
          if [ -z "$UPSTREAM_TAG" ]; then
            UPSTREAM_TAG=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)
          fi
          gh release download "$UPSTREAM_TAG" --repo "$UPSTREAM_REPO" \
            --pattern '*-release.zip' --dir "$RUNNER_TEMP/upstream-release"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import zipfile

          archive = next((Path(os.environ["RUNNER_TEMP"]) / "upstream-release").glob("*-release.zip"))
          with zipfile.ZipFile(archive) as module:
              props = dict(line.split("=", 1) for line in module.read("module.prop").decode().splitlines() if "=" in line)
          path = Path("build.gradle.kts")
          source = path.read_text()

          source = re.sub(r'^val appVerCode by extra\(.*\).*$', f'val appVerCode by extra({int(props["versionCode"])})', source, flags=re.MULTILINE)
          version = json.dumps(props["version"], ensure_ascii=False).replace("$", "\\$")
          source = source.replace('val appVerName by extra(gitVersionName)', f'val appVerName by extra({version})')
          path.write_text(source)
          PY
          echo "tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"

      - name: Replace upstream owner with repository owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UPSTREAM_OWNER=$(gh api "repos/$GITHUB_REPOSITORY" --jq .parent.owner.login)
          git ls-files --recurse-submodules -z |
            while IFS= read -r -d '' path; do
              if [ -f "$path" ] && [ ! -L "$path" ]; then
                sed -i "s/$UPSTREAM_OWNER/$GITHUB_REPOSITORY_OWNER/g" "$path"
              fi
              while [ "$path" != . ]; do
                printf '%s\0' "$path"
                path=$(dirname -- "$path")
              done
            done |
            sort -zru |
            while IFS= read -r -d '' path; do
              name=${path##*/}
              if [[ "$name" == *"$UPSTREAM_OWNER"* ]]; then
                mv -T -- "$path" "$(dirname -- "$path")/${name//$UPSTREAM_OWNER/$GITHUB_REPOSITORY_OWNER}"
              fi
            done
          sed -i "s|https://furkank.net/hma_oss_update_checker.json|https://github.com/$GITHUB_REPOSITORY/releases/latest/download/update.json|g" zygote/build.gradle.kts

      - name: Gradle prebuild
        run: |
          ./gradlew prebuild

      - name: Build APK
        run: |
          ./gradlew :app:assemble

      - name: Upload APK mappings
        uses: actions/upload-artifact@v7
        with:
          name: app-mappings
          path: "app/build/outputs/mapping/release"

      - name: Build module
        id: buildModule
        run: |
          ./gradlew :zygote:assemble
          echo "releaseName=$(ls zygote/build/outputs/magisk/release/*.zip | awk -F '(/|.zip)' '{print $6}')" >> $GITHUB_OUTPUT
          echo "debugName=$(ls zygote/build/outputs/magisk/debug/*.zip | awk -F '(/|.zip)' '{print $6}')" >> $GITHUB_OUTPUT
          echo "releaseFile=$(ls zygote/build/outputs/magisk/release/*.zip)" >> $GITHUB_OUTPUT
          echo "debugFile=$(ls zygote/build/outputs/magisk/debug/*.zip)" >> $GITHUB_OUTPUT
          echo "ossNum=$(ls app/build/outputs/apk/debug/*.apk | awk -F '(/|.apk)' '{print $6}' | cut -f4 -d'-')" >> $GITHUB_OUTPUT

      - name: Write module update feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_FILE: ${{ steps.buildModule.outputs.releaseFile }}
          REPOSITORY: ${{ github.repository }}
          UPSTREAM_TAG: ${{ steps.upstreamVersion.outputs.tag }}
        run: |
          UPSTREAM_REPO=$(gh api "repos/$GITHUB_REPOSITORY" --jq .parent.full_name)
          gh api "repos/$UPSTREAM_REPO/releases/tags/$(jq -rn --arg tag "$UPSTREAM_TAG" '$tag | @uri')" \
            --jq '.body // ""' > changelog.md
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import zipfile
          from urllib.parse import quote

          archive = Path(os.environ["RELEASE_FILE"])
          with zipfile.ZipFile(archive) as module:
              props = dict(line.split("=", 1) for line in module.read("module.prop").decode().splitlines() if "=" in line)
          release = f"https://github.com/{os.environ['REPOSITORY']}/releases/download/{quote(os.environ['UPSTREAM_TAG'], safe='')}"
          Path("update.json").write_text(json.dumps({
              "version": props["version"],
              "versionCode": int(props["versionCode"]),
              "zipUrl": f"{release}/{archive.name}",
              "changelog": f"{release}/changelog.md",
          }, indent=2) + "\n")
          PY

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: ${{ steps.buildModule.outputs.releaseName }}
          path: ${{ steps.buildModule.outputs.releaseFile }}

      - name: Upload module mappings
        uses: actions/upload-artifact@v7
        with:
          name: zygote-mappings
          path: "zygote/build/outputs/mapping/release"

      - name: Upload debug
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: ${{ steps.buildModule.outputs.debugName }}
          path: ${{ steps.buildModule.outputs.debugFile }}

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.upstreamVersion.outputs.tag }}
          body_path: changelog.md
          files: |
            ${{ steps.buildModule.outputs.releaseFile }}
            ${{ steps.buildModule.outputs.debugFile }}
            app/src/main/assets/translators.json
            update.json
            changelog.md
          tag_name: ${{ steps.upstreamVersion.outputs.tag }}

      - name: Post to channel
        if: ${{ github.event_name != 'pull_request' && success() && github.ref == 'refs/heads/master' }}
        env:
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          export release=${{ steps.buildModule.outputs.releaseFile }}
          export debug=${{ steps.buildModule.outputs.debugFile }}
          ESCAPED=`python3 -c 'import json,os,urllib.parse; msg = json.dumps(os.environ["COMMIT_MESSAGE"]); print(urllib.parse.quote(msg if len(msg) <= 1024 else json.dumps(os.environ["COMMIT_URL"])))'`
          curl -v "https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup?chat_id=${CHANNEL_ID}&media=%5B%7B%22type%22:%22document%22,%20%22media%22:%22attach://release%22%7D,%7B%22type%22:%22document%22,%20%22media%22:%22attach://debug%22,%22caption%22:${ESCAPED}%7D%5D"  -F release="@$release" -F debug="@$debug"
